<style>
:root {

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }

.top { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; z-index: 5; pointer-events: none; }

.icon-btn svg { width: 18px; height: 18px; }

.shade { position: fixed; left: 0; right: 0; top: 0; height: 240px; z-index: 3; pointer-events: none; background: linear-gradient(rgba(8, 9, 16, 0.7), rgba(8, 9, 16, 0.2) 65%, transparent); }

.toast { position: fixed; left: 50%; top: calc(max(14px, env(safe-area-inset-top)) + 64px); transform: translate(-50%, -12px); z-index: 6; padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.5s var(--spring); white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast span { color: var(--gold); margin-left: 6px; font-variant-numeric: tabular-nums; }

.dock { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 6; width: min(calc(100% - 28px), 440px); padding: 18px 18px 14px; border-radius: 28px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45); transition: transform 0.6s var(--spring), opacity 0.4s var(--ease); }

.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); }
.price { margin-top: 4px; font-size: 30px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }

.facts-row { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 14px 0 14px; padding-top: 14px; border-top: 0.5px solid var(--stroke); font-size: 13px; font-weight: 600; color: #d8d8de; }

.cta { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 50px; border-radius: 14px; font-size: 16px; font-weight: 700; letter-spacing: -0.015em; color: #111216; background: #f5f3ef; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25); transition: transform 0.4s var(--spring), background 0.2s; }

.cta:active { transform: scale(0.97); }

.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
.tile { display: flex; align-items: center; justify-content: center; gap: 6px; height: 40px; border-radius: 12px; font-size: 13px; font-weight: 600; color: #cfcfd6; background: rgba(255, 255, 255, 0.06); transition: transform 0.4s var(--spring), color 0.2s, background 0.25s; }
.tile svg { width: 16px; height: 16px; flex: none; }
.tile:active { transform: scale(0.94); }

.scrim.show { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 50%; bottom: 0; z-index: 8; width: min(100%, 520px); max-height: 78vh; overflow: auto; border-radius: 32px 32px 0 0; padding: 10px max(22px, env(safe-area-inset-left)) calc(26px + env(safe-area-inset-bottom)); box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.3); transform: translate(-50%, 105%); transition: transform 0.6s var(--spring); }
.sheet.show { transform: translate(-50%, 0); }
.sheet.peek { max-height: 42vh; }
.sheet-x { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; background: rgba(255, 255, 255, 0.1); color: var(--muted); }

.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--stroke); margin: 0 auto 14px; }
.sheet h2 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.035em; padding-right: 36px; }
.sheet .sub { margin: 6px 0 18px; color: var(--muted); font-size: 15px; line-height: 1.45; }
.row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 12px 14px; border-radius: 18px; background: var(--glass-2); margin-bottom: 8px; transition: transform 0.3s var(--spring), background 0.2s; }
button.row:active { transform: scale(0.97); }
.row.on { background: rgba(232, 194, 122, 0.16); }
.row .sw { width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center; font-size: 19px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3); }
.row b { display: block; font-size: 15px; font-weight: 600; }
.row small { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }

.facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 16px; }
.fact { padding: 12px 6px; border-radius: 16px; background: var(--glass-2); text-align: center; }
.fact b { display: block; font-size: 19px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.fact small { font-size: 11px; color: var(--muted); }
.pill-btn { display: block; width: 100%; padding: 15px; border-radius: 14px; font-size: 16px; font-weight: 700; letter-spacing: -0.015em; color: #111216; background: #f5f3ef; text-align: center; text-decoration: none; margin-top: 14px; transition: transform 0.4s var(--spring), opacity 0.2s; }
.pill-btn:active { transform: scale(0.97); }
.pill-btn[disabled] { opacity: 0.4; pointer-events: none; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.label { margin: 18px 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); margin-top: 12px; line-height: 1.45; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { padding: 14px 10px; border-radius: 16px; background: var(--glass-2); }
.stat b { display: block; font-size: 26px; font-weight: 700; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; color: var(--gold); }
.stat small { font-size: 11px; color: var(--muted); }
.bars { display: flex; align-items: flex-end; gap: 8px; height: 110px; padding: 14px 14px 0; border-radius: 18px; background: var(--glass-2); margin-top: 8px; }
.bars div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; font-size: 11px; color: var(--muted); padding-bottom: 8px; }
.bars i { display: block; width: 100%; border-radius: 6px 6px 3px 3px; background: linear-gradient(180deg, var(--gold), rgba(201, 151, 63, 0.4)); transform-origin: bottom; animation: grow 0.9s var(--spring) both; }
@keyframes grow { from { transform: scaleY(0); } }
.done { text-align: center; padding: 10px 0 4px; }
.done .tick { width: 72px; height: 72px; border-radius: 50%; background: var(--ok); margin: 0 auto 14px; display: grid; place-items: center; animation: pop 0.7s var(--spring); }
.done .tick svg { width: 36px; height: 36px; color: #fff; }
@keyframes pop { from { transform: scale(0.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.intro { position: fixed; inset: 0; z-index: 9; display: grid; place-items: end center; padding-bottom: calc(60px + env(safe-area-inset-bottom)); pointer-events: none; transition: opacity 0.8s var(--ease); }
.intro.gone { opacity: 0; }
.intro .msg { padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; } }

:root { --bg: #1a1814; --glass: rgba(247, 245, 241, 0.94); --glass-2: rgba(60, 50, 30, 0.06); --stroke: rgba(0, 0, 0, 0.1); --text: #1b1a17; --muted: #6e695f; --gold: #a8925c; --gold-2: #8a7442; --serif: "Bodoni Moda", "Bodoni 72", Didot, Georgia, serif; --font: "Lato", -apple-system, "Segoe UI", system-ui, sans-serif; color-scheme: light; }

.amen { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin-top: 4px; }
.amen div { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.35; color: var(--muted); }

@media (min-width: 900px) {
  .dock { left: 24px; bottom: 24px; transform: none; width: 420px; }

  .sheet.show { transform: none; }
  .sheet.peek { max-height: calc(100vh - 110px); }
  .toast, .legend { left: calc(50% + 230px); }
}
.fine { margin-top: 10px; font-size: 11px; color: var(--muted); text-align: center; }
.legend { position: fixed; left: 50%; top: calc(max(14px, env(safe-area-inset-top)) + 64px); transform: translate(-50%, -12px); z-index: 5; display: flex; gap: 14px; padding: 9px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.5s var(--spring); white-space: nowrap; }

const $ = (id) => document.getElementById(id);
const ease = (x) => { x = Math.min(Math.max(x, 0), 1); return 1 - Math.pow(1 - x, 3); };
const springE = (x) => { x = Math.min(Math.max(x, 0), 1); return 1 - Math.exp(-6 * x) * Math.cos(9 * x); };

/* ---------- The floor, drawn as a typical Grade A City flex floorplate (metres, x across, z down the page) ---------- */

{

  box(outside, 3.2, 2.9, 0.15, 0, 1.45, D / 2 + 0.05, black); box(outside, 1.3, 2.4, 0.05, -0.7, 1.25, D / 2 + 0.14, lit); box(outside, 1.3, 2.4, 0.05, 0.7, 1.25, D / 2 + 0.14, lit);
  box(outside, 4.4, 0.18, 1.6, 0, 3.2, D / 2 + 0.8, brass);
  [-2.3, 2.3].forEach((x) => { box(outside, 0.08, 0.6, 0.08, x, 2.6, D / 2 + 0.35, black); box(outside, 0.35, 0.5, 0.35, x, 2.2, D / 2 + 0.45, lit); box(outside, 0.45, 0.08, 0.45, x, 2.5, D / 2 + 0.45, black); });

/* ---------- Camera: orbit with drag, fly to spaces ---------- */
const HOME = { az: -0.5, pol: 0.9, r: 33, tx: 0, ty: 1.2, tz: 0.8 };
const cam = { az: 0.0, pol: 0.02, r: 33, tx: 0, ty: 0, tz: 0 }, goal = { ...HOME };
let intro = true, t0 = performance.now(), view = 'in', occ = false;
function placeCamera() {
  const sp = Math.sin(cam.pol);
  camera.position.set(cam.tx + cam.r * sp * Math.sin(cam.az), cam.ty + cam.r * Math.cos(cam.pol), cam.tz + cam.r * sp * Math.cos(cam.az));
  camera.lookAt(cam.tx, cam.ty, cam.tz);
}
const fitR = (r) => r * Math.max(1, 1.1 * innerHeight / innerWidth); // pull back on a phone held upright
function resize() { // shift the picture clear of the card: right of it on a wide screen, above it on a phone
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h;
  if (w >= 900) camera.setViewOffset(w, h, -230, 0, w, h); else camera.setViewOffset(w, h, 0, h * 0.17, w, h);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

let drag = null, moved = 0;
canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; moved = 0; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => {
  if (!drag || intro) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; moved += Math.abs(dx) + Math.abs(dy);
  goal.az -= dx * 0.006; goal.pol = Math.min(1.35, Math.max(0.15, goal.pol - dy * 0.005)); drag = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('pointerup', (e) => { if (drag && moved < 8 && !intro) pick(e); drag = null; });
canvas.addEventListener('wheel', (e) => { e.preventDefault(); goal.r = Math.min(120, Math.max(8, goal.r * (1 + e.deltaY * 0.001))); }, { passive: false });

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(e) {
  if (view !== 'in') return;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects([...labels.children.filter((l) => l.visible), ...floors.children])[0];
  focusRoom(hit ? hit.object.userData.room : null);
}
let focused = null, toastT;
const info = (r) => r.kind === 'office' ? `${r.desks} desks · ${r.m2.toFixed(0)} m² · ${STATUS[r.status].txt}${r.price ? ' · ' + r.price + ' pcm' : ''}` : r.kind === 'meet' ? `${r.seats} seats · bookable by the hour` : r.desks ? `${r.desks} hot desks · members` : 'Shared by everyone on the floor';
function focusRoom(r) {

  SPACES.forEach((x) => [x.label, x.occLabel].forEach((l) => l && (l.material.opacity = !r || x === r ? 1 : 0.12)));
  if (!r) { Object.assign(goal, { tx: 0, ty: HOME.ty, tz: HOME.tz, r: fitR(HOME.r) }); $('toast').classList.remove('show'); return; }
  const [x1, z1, x2, z2] = r.rect, d = openKey === 'spaces' ? 2.4 : 0;
  Object.assign(goal, { tx: r.c.x - CX + Math.sin(goal.az) * d, ty: 0.4, tz: r.c.z - CZ + Math.cos(goal.az) * d, r: fitR(Math.max(11, 1.9 * Math.max(x2 - x1, z2 - z1))), pol: Math.min(goal.pol, 0.9) });
  $('toast').innerHTML = `${r.em} ${r.name}<span>${info(r)}</span>`; $('toast').classList.add('show'); $('legend').classList.remove('show');
  clearTimeout(toastT); toastT = setTimeout(() => { $('toast').classList.remove('show'); if (occ) $('legend').classList.add('show'); }, 3200);
  document.querySelectorAll('.row[data-room]').forEach((b) => b.classList.toggle('on', b.dataset.room === r.id));
}

function setOcc(on) {

/* ---------- Intro timeline ---------- */
const INTRO = 3.6;
function runIntro(t) {
  base.scale.set(1, Math.max(0.0001, ease(t / 0.5)), 1);
  floors.children.forEach((m) => { const k = springE((t - 0.35 - m.userData.d) / 0.6); m.scale.setScalar(Math.max(0.0001, k)); });
  walls.scale.set(1, Math.max(0.0001, springE((t - 1.1) / 0.9)), 1);
  furniture.children.forEach((m) => { const k = springE((t - 1.8 - m.userData.d) / 0.8); m.position.y = m.userData.y + (1 - k) * 3; m.visible = t > 1.8 + m.userData.d; });

  const k = ease(t / 3.4);

    <div class="label">On every floor</div>

    <div class="label">Views per day</div>
    <div class="bars">${[['M', 34], ['T', 29], ['W', 41], ['T', 38], ['F', 30], ['S', 12], ['S', 8]].map(([d, n], i) => `<div><i style="height:${n * 1.9}px;animation-delay:${i * 0.05}s"></i>${d}</div>`).join('')}</div>
    <div class="label">Most looked-at spaces</div>

    <div class="row"><div class="sw" style="background:#30d158">💼</div><div><b>Suite 405</b><small>2 desks · available</small></div><div class="end">24%</div></div>

};
let openKey = null;
function openSheet(key) {
  if (openKey === key) return closeSheet();
  if (key === 'spaces' && view !== 'in') setView('in');
  openKey = key; sheet.innerHTML = '<div class="grab"></div><button class="icon-btn sheet-x" id="sheetX" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg></button>' + panels[key]();
  sheet.classList.toggle('peek', key === 'spaces'); scrim.classList.toggle('show', key !== 'spaces');
  $('sheetX').onclick = closeSheet; sheet.classList.add('show'); $('dock').classList.add('hide');
  document.querySelectorAll('.tile[data-panel]').forEach((t) => t.classList.toggle('on', t.dataset.panel === key));
  if (key === 'spaces') sheet.querySelectorAll('.row[data-room]').forEach((b) => (b.onclick = () => focusRoom(SPACES.find((r) => r.id === b.dataset.room))));
  if (key === 'tour') {
    const sel = { sizes: null, slots: null };
    ['sizes', 'slots'].forEach((g) => $(g).querySelectorAll('.chip').forEach((c) => (c.onclick = () => { sel[g] = c.textContent; $(g).querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x === c)); $('vSend').disabled = !(sel.sizes && sel.slots); })));

scrim.addEventListener('click', closeSheet);
addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

/* ---------- Frame loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (intro) runIntro((now - t0) / 1000);
  else {
    const k = 1 - Math.pow(0.002, dt);
    for (const p of ['az', 'pol', 'r', 'tx', 'ty', 'tz']) cam[p] += (goal[p] - cam[p]) * k;
    if (!drag && !focused && !openKey) goal.az += dt * 0.04;
    if (outside.visible) outside.scale.setScalar(outside.scale.x + (1 - outside.scale.x) * k);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
