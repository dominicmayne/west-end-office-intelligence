<style>
:root {
  --bg: #0b0d14;
  --glass: rgba(22, 23, 28, 0.72);

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
canvas#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.top { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; z-index: 5; pointer-events: none; }

.done .tick { width: 72px; height: 72px; border-radius: 50%; background: var(--ok); margin: 0 auto 14px; display: grid; place-items: center; animation: pop 0.7s var(--spring); }

@keyframes pop { from { transform: scale(0.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.intro { position: fixed; inset: 0; z-index: 9; display: grid; place-items: end center; padding-bottom: calc(60px + env(safe-area-inset-bottom)); pointer-events: none; transition: opacity 0.8s var(--ease); }

@media (prefers-reduced-motion: reduce) { * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; } }
</style>

<script>

/* ---------- Renderer, scene, camera ---------- */
const canvas = $('world');

{
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;

function textSprite(top, bottom) {

  const g = c.getContext('2d');

const house = new THREE.Group(); scene.add(house);
const plan = new THREE.Group(); plan.position.set(-CX, 0.3, -CZ); house.add(plan); // sits on a 0.3 m slab, clear of the ground

  }
}
function closeSheet() { if (!intro) $('dock').classList.remove('hide'); openKey = null; sheet.classList.remove('show'); scrim.classList.remove('show'); document.querySelectorAll('.tile[data-panel]').forEach((t) => t.classList.remove('on')); }
document.querySelectorAll('.tile[data-panel]').forEach((t) => t.addEventListener('click', () => openSheet(t.dataset.panel)));
$('viewBtn').addEventListener('click', () => openSheet('viewing'));
scrim.addEventListener('click', closeSheet);
addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

/* ---------- Frame loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (intro) runIntro((now - t0) / 1000);
  else {
    const k = 1 - Math.pow(0.002, dt);
    for (const p of ['az', 'pol', 'r', 'tx', 'ty', 'tz']) cam[p] += (goal[p] - cam[p]) * k;
    if (!drag && !focused && !openKey) goal.az += dt * 0.04;
    if (outside.visible) outside.scale.setScalar(outside.scale.x + (1 - outside.scale.x) * k);
  }
  ROOMS.forEach((r) => (r.mat.emissiveIntensity = r === focused ? 0.18 + Math.sin(now / 300) * 0.08 : 0));
  placeCamera(); renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
