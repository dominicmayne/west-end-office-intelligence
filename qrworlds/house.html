<style>
:root {
  --bg: #0b0d14;
  --glass: rgba(22, 23, 28, 0.72);
  --glass-2: rgba(255, 255, 255, 0.07);
  --stroke: rgba(255, 255, 255, 0.12);
  --text: #f5f5f7;
  --muted: #a7a7b0;
  --gold: #d9b77e;
  --gold-2: #b8925a;
  --ok: #30d158;
  --blue: #0a84ff;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", system-ui, sans-serif;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
canvas#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.glass { background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px); border: 0.5px solid var(--stroke); }

.top { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; z-index: 5; pointer-events: none; }
.top > * { pointer-events: auto; }
.badge { display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 10px; border-radius: 999px; }
.mark { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: #f5f3ef; color: #111216; font-weight: 800; font-size: 12px; letter-spacing: -0.04em; }
.badge b { display: block; font-size: 14px; font-weight: 700; letter-spacing: -0.02em; }
.badge small { display: block; font-size: 11px; color: var(--muted); }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; transition: transform 0.4s var(--spring); }
.icon-btn:active { transform: scale(0.88); }
.icon-btn svg { width: 18px; height: 18px; }

.shade { position: fixed; left: 0; right: 0; top: 0; height: 240px; z-index: 3; pointer-events: none; background: linear-gradient(rgba(8, 9, 16, 0.7), rgba(8, 9, 16, 0.2) 65%, transparent); }

.toast { position: fixed; left: 50%; top: calc(max(14px, env(safe-area-inset-top)) + 116px); transform: translate(-50%, -12px); z-index: 6; padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.5s var(--spring); white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast span { color: var(--gold); margin-left: 6px; font-variant-numeric: tabular-nums; }

.dock { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 6; width: min(calc(100% - 28px), 440px); padding: 18px 18px 14px; border-radius: 28px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45); transition: transform 0.6s var(--spring), opacity 0.4s var(--ease); }
.dock.hide { transform: translate(-50%, 130%); opacity: 0; }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); }
.price { margin-top: 4px; font-size: 30px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }

.addr { margin-top: 6px; font-size: 14px; color: var(--muted); }
.facts-row { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 14px 0 14px; padding-top: 14px; border-top: 0.5px solid var(--stroke); font-size: 13px; font-weight: 600; color: #d8d8de; }
.facts-row span { display: inline-flex; align-items: center; gap: 6px; }
.facts-row svg { width: 16px; height: 16px; color: var(--muted); }
.cta { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 50px; border-radius: 14px; font-size: 16px; font-weight: 700; letter-spacing: -0.015em; color: #111216; background: #f5f3ef; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25); transition: transform 0.4s var(--spring), background 0.2s; }

.cta:active { transform: scale(0.97); }
.cta svg { width: 18px; height: 18px; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
.tile { display: flex; align-items: center; justify-content: center; gap: 6px; height: 40px; border-radius: 12px; font-size: 13px; font-weight: 600; color: #cfcfd6; background: rgba(255, 255, 255, 0.06); transition: transform 0.4s var(--spring), color 0.2s, background 0.25s; }
.tile svg { width: 16px; height: 16px; flex: none; }
.tile:active { transform: scale(0.94); }
.tile.on { color: #111216; background: var(--gold); }
@media (max-width: 380px) { .tile svg { display: none; } }
.tile:focus-visible, .cta:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.sheet { position: fixed; left: 50%; bottom: 0; z-index: 8; width: min(100%, 520px); max-height: 78vh; overflow: auto; border-radius: 32px 32px 0 0; padding: 10px max(22px, env(safe-area-inset-left)) calc(26px + env(safe-area-inset-bottom)); box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.3); transform: translate(-50%, 105%); transition: transform 0.6s var(--spring); }
.sheet.show { transform: translate(-50%, 0); }
.sheet.peek { max-height: 42vh; }

.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--stroke); margin: 0 auto 14px; }
.sheet h2 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.035em; padding-right: 36px; }

.row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 12px 14px; border-radius: 18px; background: var(--glass-2); margin-bottom: 8px; transition: transform 0.3s var(--spring), background 0.2s; }
button.row:active { transform: scale(0.97); }
.row.on { background: rgba(232, 194, 122, 0.16); }

.row b { display: block; font-size: 15px; font-weight: 600; }

.facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 16px; }
.fact { padding: 12px 6px; border-radius: 16px; background: var(--glass-2); text-align: center; }
.fact b { display: block; font-size: 19px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.fact small { font-size: 11px; color: var(--muted); }
.pill-btn { display: block; width: 100%; padding: 15px; border-radius: 14px; font-size: 16px; font-weight: 700; letter-spacing: -0.015em; color: #111216; background: #f5f3ef; text-align: center; text-decoration: none; margin-top: 14px; transition: transform 0.4s var(--spring), opacity 0.2s; }
.pill-btn:active { transform: scale(0.97); }
.pill-btn[disabled] { opacity: 0.4; pointer-events: none; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.chip.on { border-color: var(--gold); color: var(--gold); }
.label { margin: 18px 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); margin-top: 12px; line-height: 1.45; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { padding: 14px 10px; border-radius: 16px; background: var(--glass-2); }

.bars { display: flex; align-items: flex-end; gap: 8px; height: 110px; padding: 14px 14px 0; border-radius: 18px; background: var(--glass-2); margin-top: 8px; }
.bars div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; font-size: 11px; color: var(--muted); padding-bottom: 8px; }
.bars i { display: block; width: 100%; border-radius: 6px 6px 3px 3px; background: linear-gradient(180deg, var(--gold), rgba(201, 151, 63, 0.4)); transform-origin: bottom; animation: grow 0.9s var(--spring) both; }
@keyframes grow { from { transform: scaleY(0); } }
.done { text-align: center; padding: 10px 0 4px; }
.done .tick { width: 72px; height: 72px; border-radius: 50%; background: var(--ok); margin: 0 auto 14px; display: grid; place-items: center; animation: pop 0.7s var(--spring); }
.done .tick svg { width: 36px; height: 36px; color: #fff; }
@keyframes pop { from { transform: scale(0.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.floors { position: fixed; left: 50%; top: calc(max(14px, env(safe-area-inset-top)) + 60px); transform: translateX(-50%); z-index: 5; display: flex; gap: 2px; padding: 4px; border-radius: 999px; transition: opacity 0.4s var(--ease); }
.floors.hide { opacity: 0; pointer-events: none; }
.floors button { height: 34px; padding: 0 14px; white-space: nowrap; border-radius: 999px; font-size: 13px; font-weight: 600; color: #cfcfd6; transition: background 0.25s, color 0.2s, transform 0.4s var(--spring); }
.floors button:active { transform: scale(0.94); }
.floors button.on { background: #f5f3ef; color: #111216; }
.disc { margin-top: 4px; font-size: 11px; color: #7d7d86; }
.intro { position: fixed; inset: 0; z-index: 9; display: grid; place-items: end center; padding-bottom: calc(60px + env(safe-area-inset-bottom)); pointer-events: none; transition: opacity 0.8s var(--ease); }
.intro.gone { opacity: 0; }
.intro .msg { padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; } }
</style>

const check = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const hex = (n) => '#' + n.toString(16).padStart(6, '0');
const roomRow = (r) => `<button class="row" data-room="${r.id}"><div class="sw" style="background:${hex(r.col)}">${r.em}</div><div><b>${r.name}</b><small>${r.ft || r.size}</small></div><div class="end">${r.ft ? r.size : ''}</div></button>`;
const panels = {
  rooms: () => `<h2>Inside the house</h2><p class="sub">Tap a room to fly to it. Sizes are from the floorplan.</p>
    <div class="facts"><div class="fact"><b>4</b><small>Bedrooms</small></div><div class="fact"><b>1+1</b><small>Bath + WC</small></div><div class="fact"><b>982</b><small>Sq ft</small></div><div class="fact"><b>2</b><small>Floors</small></div></div>
    <div class="label">Ground floor</div>${ROOMS.filter((r) => r.fl === 0).map(roomRow).join('')}
    <div class="label">First floor</div>${ROOMS.filter((r) => r.fl === 1).map(roomRow).join('')}
    <p class="note">Total area 91.2 m² (982 sq ft). Measurements are approximate. The model is drawn from the floorplan, so furniture is for scale only.</p>`,
  area: () => `<h2>Around Linden Street</h2><p class="sub">Walking times from the front door.</p>
    <div class="row"><div class="sw" style="background:#ff9f0a">🛍️</div><div><b>Albany Road</b><small>Shops, cafés, supermarket</small></div><div class="end">5 min walk</div></div>
    <div class="row"><div class="sw" style="background:#30d158">🌳</div><div><b>Roath Park</b><small>Lake, rose garden, playground</small></div><div class="end">15 min walk</div></div>
    <div class="row"><div class="sw" style="background:#0a84ff">🚆</div><div><b>Train station</b><small>Into the city centre</small></div><div class="end">12 min walk</div></div>
    <div class="row"><div class="sw" style="background:#bf5af2">🎓</div><div><b>University</b><small>Main campus</small></div><div class="end">15 min walk</div></div>
    <div class="row"><div class="sw" style="background:#ff375f">🚌</div><div><b>Bus stop</b><small>Every few minutes into town</small></div><div class="end">2 min walk</div></div>
    <p class="note">Sample places and times for the demo. In the real version these come from the agent's listing and public transport data.</p>`,
  viewing: () => `<div id="vBody"><h2>Book a viewing</h2><p class="sub">Pick a time that suits. The agent confirms by email.</p>
    <div class="label">This week</div><div class="chips">${['Thu 17:30', 'Fri 12:15', 'Sat 10:00', 'Sat 11:30', 'Mon 18:00'].map((s) => `<button class="chip">${s}</button>`).join('')}</div>
    <button class="pill-btn" id="vSend" disabled>Request this time</button>
    <a class="pill-btn ghost" href="mailto:dominic.d.mayne@gmail.com?subject=HomeWorld%20demo">Ask a question</a>
    <p class="note">In the real version this opens the agent's own booking page, so their diary stays the one place viewings live.</p></div>`,
  agent: () => `<h2>What the landlord sees</h2><p class="sub">Every scan of the board and window card, tracked for this property.</p>
    <div class="stats"><div class="stat"><b>211</b><small>Board scans this week</small></div><div class="stat"><b>18</b><small>Viewing requests</small></div><div class="stat"><b>3m 05s</b><small>Avg time inside</small></div></div>
    <div class="label">Scans per day</div>
    <div class="bars">${[['M', 22], ['T', 19], ['W', 26], ['T', 28], ['F', 31], ['S', 47], ['S', 38]].map(([d, n], i) => `<div><i style="height:${n * 1.7}px;animation-delay:${i * 0.05}s"></i>${d}</div>`).join('')}</div>
    <div class="label">Most looked-at rooms</div>
    <div class="row"><div class="sw" style="background:#f2cfd3">🍳</div><div><b>Kitchen / diner</b><small>Breakfast bar, garden door</small></div><div class="end">34%</div></div>
    <div class="row"><div class="sw" style="background:#cfe8cf">🛏️</div><div><b>Bedroom 1</b><small>Front double</small></div><div class="end">22%</div></div>
    <p class="note">Example numbers for the demo. Agents send these in their weekly update to the landlord or seller, and nobody scanning gives a name or phone number.</p>`,
};
let openKey = null;
function openSheet(key) {
  if (openKey === key) return closeSheet();
  if (key === 'rooms' && view !== 'in') setView('in');
  openKey = key; sheet.innerHTML = '<div class="grab"></div><button class="icon-btn sheet-x" id="sheetX" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg></button>' + panels[key]();
  sheet.classList.toggle('peek', key === 'rooms'); scrim.classList.toggle('show', key !== 'rooms');
  $('sheetX').onclick = closeSheet; sheet.classList.add('show'); $('dock').classList.add('hide');
  document.querySelectorAll('.tile[data-panel]').forEach((t) => t.classList.toggle('on', t.dataset.panel === key));
  if (key === 'rooms') sheet.querySelectorAll('.row[data-room]').forEach((b) => (b.onclick = () => focusRoom(ROOMS.find((r) => r.id === b.dataset.room))));
  if (key === 'viewing') {
    let pick = null;
    sheet.querySelectorAll('.chip').forEach((c) => (c.onclick = () => { pick = c.textContent; sheet.querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x === c)); $('vSend').disabled = false; }));
    $('vSend').onclick = () => { $('vBody').innerHTML = `<div class="done"><div class="tick">${check}</div><h2 style="padding:0">Request sent</h2><p class="sub">${pick} at Linden Street. In the real version this goes straight into the agent's diary.</p></div>`; };
  }
}
function closeSheet() { if (!intro) $('dock').classList.remove('hide'); openKey = null; sheet.classList.remove('show'); scrim.classList.remove('show'); document.querySelectorAll('.tile[data-panel]').forEach((t) => t.classList.remove('on')); }
document.querySelectorAll('.tile[data-panel]').forEach((t) => t.addEventListener('click', () => openSheet(t.dataset.panel)));
$('viewBtn').addEventListener('click', () => openSheet('viewing'));
scrim.addEventListener('click', closeSheet);
addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

/* ---------- Frame loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (intro) runIntro((now - t0) / 1000);
  else {
    const k = 1 - Math.pow(0.002, dt);
    for (const p of ['az', 'pol', 'r', 'tx', 'ty', 'tz']) cam[p] += (goal[p] - cam[p]) * k;
    if (!drag && !focused && !openKey) goal.az += dt * 0.04;
    if (outside.visible) outside.scale.setScalar(outside.scale.x + (1 - outside.scale.x) * k);
    LV.forEach((L) => { // a hidden floor floats up and fades out of the way
      const ty = L.show ? L.ty : L.y + 3.5, s = L.show ? 1 : 0.0001;
      L.g.position.y += (ty - L.g.position.y) * k;
      const sc = L.g.scale.y + (s - L.g.scale.y) * k; L.g.scale.set(1, sc, 1);
      if (!L.show && sc < 0.02) L.g.visible = false;
    });
  }
  ROOMS.forEach((r) => (r.mat.emissiveIntensity = r === focused ? 0.18 + Math.sin(now / 300) * 0.08 : 0));
  placeCamera(); renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
