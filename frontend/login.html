<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Sign in to West End Office Intelligence.">
    <title>Sign In — West End Office Intelligence</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#f4f0e6">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/site.css">
    <style>
        body { display: flex; flex-direction: column; }
        .main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: 80px; align-items: center; padding-top: 72px; padding-bottom: 96px; }
        .side .h1 { margin: 18px 0 18px; }
        .side p { color: var(--ink-2); max-width: 28em; }
        .form { border-top: 1px solid var(--ink); padding-top: 22px; }
        .field { margin-bottom: 20px; }
        .field label { display: block; font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); margin-bottom: 8px; }
        .field input { width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: #faf8f2; border: 1px solid var(--rule); border-bottom: 1.5px solid var(--ink); padding: 12px 14px; border-radius: 0; outline: none; }
        .field input:focus { border-bottom-color: var(--accent); background: #fff; }
        .field input::placeholder { color: var(--ink-3); opacity: 0.7; }
        .error-msg { border-left: 2px solid var(--bad); background: var(--accent-wash); color: var(--accent-ink); padding: 10px 14px; font-size: 14px; margin-bottom: 18px; display: none; }
        .submit-btn { width: 100%; justify-content: center; padding: 14px 20px; font-size: 15px; }
        .form-foot { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 22px; font-size: 13.5px; color: var(--ink-3); }
        .form-foot a { color: var(--ink-2); }
        @media (max-width: 860px) {
            .main { grid-template-columns: 1fr; gap: 40px; padding-top: 40px; padding-bottom: 64px; align-items: start; }
        }
    </style>
</head>
<body>

<header class="mast">
    <div class="wrap mast-in">
        <a href="/" class="mark"><img src="/favicon.svg" alt="" width="28" height="28"><span class="mark-name">Dominic Mayne</span><span class="mark-sub hide-sm">West End Office Intelligence</span></a>
    </div>
</header>

<main class="wrap main">
    <div class="side">
        <div class="kicker">Secure access</div>
        <h1 class="h1">Sign in</h1>
        <p>Enter your access password to view the platform</p>
    </div>
    <div class="form">
        <div class="error-msg" id="errorMsg">Incorrect password. Please try again.</div>
        <div class="field">
            <label for="passwordInput">Access password</label>
            <input type="password" id="passwordInput" placeholder="Enter password" autocomplete="current-password" onkeydown="if(event.key==='Enter')checkPassword()"/>
        </div>
        <button class="btn btn-solid submit-btn" id="submitBtn" onclick="checkPassword()">Access dashboard <span class="arrow">→</span></button>
        <div class="form-foot">
            <a href="/" class="link link-quiet">← Back to home</a>
            <span>Powered by Claude · Anthropic</span>
        </div>
    </div>
</main>

<script>
    // Check if already logged in
    if (sessionStorage.getItem('weoi_auth') === 'true') {
        window.location.href = '/dashboard';
    }

    function checkPassword() {
        const input = document.getElementById('passwordInput').value;
        const btn = document.getElementById('submitBtn');
        const error = document.getElementById('errorMsg');

        // Set your password here
        const PASSWORD = 'benstaff';

        btn.disabled = true;
        btn.textContent = 'Checking…';
        error.style.display = 'none';

        setTimeout(() => {
            if (input === PASSWORD) {
                sessionStorage.setItem('weoi_auth', 'true');
                window.location.href = '/dashboard';
            } else {
                error.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = 'Access dashboard <span class="arrow">→</span>';
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        }, 600);
    }
</script>

</body>
</html>
