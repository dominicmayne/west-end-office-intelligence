<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ride World</title>
<meta name="robots" content="noindex">
<meta name="description" content="Scan a ride sticker and race it round the track. A QR Worlds concept for Ride On! Entertainment.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --bg: #0b0d14;
  --bg-2: #141826;
  --glass: rgba(28, 30, 40, 0.62);
  --glass-2: rgba(255, 255, 255, 0.06);
  --stroke: rgba(255, 255, 255, 0.12);
  --text: #f5f5f7;
  --muted: #a1a1aa;
  --accent: #ff3b30;
  --accent-2: #ffcc00;
  --ok: #30d158;
  --blue: #0a84ff;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", system-ui, sans-serif;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
canvas#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

.glass {
  background: var(--glass);
  -webkit-backdrop-filter: saturate(180%) blur(24px);
  backdrop-filter: saturate(180%) blur(24px);
  border: 0.5px solid var(--stroke);
}

/* Top bar */
.top { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; z-index: 5; pointer-events: none; }
.top > * { pointer-events: auto; }
.badge { display: flex; align-items: center; gap: 10px; padding: 9px 16px 9px 12px; border-radius: 999px; }
.badge .live { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px rgba(48, 209, 88, 0.22); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(48, 209, 88, 0); } }
.badge b { display: block; font-size: 14px; font-weight: 700; letter-spacing: -0.02em; }
.badge small { display: block; font-size: 11px; color: var(--muted); letter-spacing: -0.005em; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; transition: transform 0.4s var(--spring); }
.icon-btn:active { transform: scale(0.88); }
.icon-btn svg { width: 18px; height: 18px; }
.top-right { display: flex; gap: 8px; }

/* Hero copy */
.hero { position: fixed; left: 0; right: 0; top: calc(max(14px, env(safe-area-inset-top)) + 64px); text-align: center; z-index: 4; pointer-events: none; padding: 0 16px; transition: opacity 0.6s var(--ease), transform 0.8s var(--ease); }
.hero .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; color: #ff9f0a; }
.hero h1 { margin: 8px 0 0; font-size: clamp(38px, 11vw, 64px); font-weight: 700; letter-spacing: -0.045em; line-height: 1; color: #fff; background: linear-gradient(180deg, #ffffff 30%, #ffd2a1); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 6px 30px rgba(0, 0, 0, 0.45)); text-wrap: balance; }
.hero p { margin: 8px auto 0; max-width: 340px; font-size: 15px; color: rgba(255, 255, 255, 0.78); text-shadow: 0 2px 16px rgba(0, 0, 0, 0.5); }
.hero.hide { opacity: 0; transform: translateY(-14px); }

/* Dock: primary Race button floating above a quiet four-item tab bar */
.dock { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 6; width: min(calc(100% - 32px), 420px); display: flex; flex-direction: column; gap: 10px; transition: transform 0.6s var(--spring), opacity 0.4s var(--ease); }
.dock.hide { transform: translate(-50%, 140%); opacity: 0; }
.cta { display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 999px; font-size: 17px; font-weight: 600; letter-spacing: -0.02em; color: #fff; background: linear-gradient(180deg, #ff5247, #ff3b30); box-shadow: 0 10px 30px rgba(255, 59, 48, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.3); transition: transform 0.4s var(--spring); }
.cta:active { transform: scale(0.96); }
.cta svg { width: 18px; height: 18px; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 5px; border-radius: 26px; box-shadow: 0 18px 44px rgba(0, 0, 0, 0.35); }
.tile { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 2px 8px; border-radius: 21px; font-size: 11px; font-weight: 500; letter-spacing: -0.01em; color: var(--muted); transition: transform 0.4s var(--spring), color 0.2s, background 0.25s; }
.tile svg { width: 22px; height: 22px; }
.tile:active { transform: scale(0.9); }
.tile:focus-visible, .cta:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.tile.on { color: var(--text); background: rgba(255, 255, 255, 0.12); }

/* Sheet */
.scrim { position: fixed; inset: 0; z-index: 7; background: rgba(0, 0, 0, 0.4); opacity: 0; pointer-events: none; transition: opacity 0.4s var(--ease); }
.scrim.show { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 50%; bottom: 0; z-index: 8; width: min(100%, 520px); max-height: 82vh; overflow: auto; border-radius: 32px 32px 0 0; padding: 10px max(22px, env(safe-area-inset-left)) calc(26px + env(safe-area-inset-bottom)); box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.3); transform: translate(-50%, 105%); transition: transform 0.6s var(--spring); }
.sheet.show { transform: translate(-50%, 0); }
.sheet-x { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; background: rgba(255, 255, 255, 0.1); color: var(--muted); }
.sheet-x svg { width: 14px; height: 14px; }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--stroke); margin: 0 auto 14px; }
.sheet h2 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.035em; text-wrap: balance; }
.sheet .sub { margin: 6px 0 20px; color: var(--muted); font-size: 15px; line-height: 1.45; letter-spacing: -0.01em; }
.row { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 18px; background: var(--glass-2); margin-bottom: 8px; }
.row .sw { width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center; font-size: 20px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3); }
.row b { display: block; font-size: 15px; font-weight: 600; }
.row small { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }
.row .end { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pill-btn { display: block; width: 100%; padding: 16px; border-radius: 999px; font-size: 17px; font-weight: 600; letter-spacing: -0.015em; color: #fff; background: linear-gradient(180deg, #ff5247, #ff3b30); box-shadow: 0 8px 24px rgba(255, 59, 48, 0.35); text-align: center; text-decoration: none; margin-top: 14px; transition: transform 0.4s var(--spring), opacity 0.2s; }
.pill-btn:active { transform: scale(0.97); }
.pill-btn.blue { background: linear-gradient(180deg, #2b95ff, #0a84ff); box-shadow: 0 8px 24px rgba(10, 132, 255, 0.35); }
.pill-btn[disabled] { opacity: 0.4; pointer-events: none; }
.seasons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.season { padding: 16px 14px; border-radius: 18px; text-align: left; background: var(--glass-2); border: 1.5px solid transparent; transition: transform 0.4s var(--spring), border-color 0.2s; }
.season:active { transform: scale(0.95); }
.season.on { border-color: var(--accent-2); }
.season .em { font-size: 28px; }
.season b { display: block; margin-top: 6px; font-size: 15px; }
.season small { color: var(--muted); font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 10px 14px; border-radius: 999px; background: var(--glass-2); font-size: 14px; font-weight: 600; border: 1.5px solid transparent; transition: transform 0.3s var(--spring); }
.chip:active { transform: scale(0.94); }
.chip.on { border-color: var(--accent); color: var(--accent); }
.note { font-size: 12px; color: var(--muted); margin-top: 12px; line-height: 1.45; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 4px; }
.stat { padding: 14px 10px; border-radius: 16px; background: var(--glass-2); }
.stat b { display: block; font-size: 26px; font-weight: 700; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; background: linear-gradient(180deg, #bf5af2, #5e5ce6); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.stat small { font-size: 11px; color: var(--muted); }
.map { width: 100%; border-radius: 18px; background: var(--glass-2); margin-bottom: 12px; display: block; }
.done { text-align: center; padding: 10px 0 4px; }
.done .tick { width: 72px; height: 72px; border-radius: 50%; background: var(--ok); margin: 0 auto 14px; display: grid; place-items: center; animation: pop 0.7s var(--spring); }
.done .tick svg { width: 36px; height: 36px; color: #fff; }
@keyframes pop { from { transform: scale(0.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* Race HUD */
.hud { position: fixed; inset: 0; z-index: 6; pointer-events: none; opacity: 0; transition: opacity 0.4s var(--ease); }
.hud.show { opacity: 1; }
.err { position: fixed; left: 16px; right: 16px; top: calc(max(14px, env(safe-area-inset-top)) + 64px); z-index: 20; padding: 12px 14px; border-radius: 16px; font-size: 13px; color: #fff; }
.hud:not(.show) * { pointer-events: none !important; }
.shade { position: fixed; left: 0; right: 0; top: 0; height: 260px; z-index: 3; pointer-events: none; background: linear-gradient(rgba(0,0,0,.45), transparent); }
.hud .bar { position: absolute; top: calc(max(14px, env(safe-area-inset-top)) + 58px); left: 50%; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; border-radius: 999px; pointer-events: auto; }
.hud .bar div { padding: 6px 14px; border-radius: 999px; background: var(--glass-2); font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hud .count { position: absolute; top: 38%; left: 0; right: 0; text-align: center; font-size: 132px; font-weight: 700; letter-spacing: -0.05em; color: #fff; text-shadow: 0 10px 50px rgba(0, 0, 0, 0.5); }
.hud .count.go { animation: pop 0.5s var(--spring); }
.tap { position: absolute; left: 50%; bottom: max(28px, calc(env(safe-area-inset-bottom) + 12px)); transform: translateX(-50%); width: 132px; height: 132px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff6b61, #ff2d20 60%, #c4170d); color: #fff; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; box-shadow: 0 14px 40px rgba(255, 59, 48, 0.55), inset 0 -6px 0 rgba(0, 0, 0, 0.18); pointer-events: auto; transition: transform 0.18s var(--spring); user-select: none; -webkit-user-select: none; }
.tap.press { transform: translateX(-50%) scale(0.88); }
.hud .quit { position: absolute; top: calc(max(14px, env(safe-area-inset-top)) + 58px); right: 16px; pointer-events: auto; }
.result { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0.8); opacity: 0; width: min(calc(100% - 32px), 340px); padding: 24px 22px; border-radius: 28px; text-align: center; pointer-events: none; transition: transform 0.6s var(--spring), opacity 0.3s; }
.result.show { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
.result .em { font-size: 52px; }
.result h3 { margin: 6px 0 4px; font-size: 32px; font-weight: 700; letter-spacing: -0.04em; }
.result p { margin: 0; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }

/* Intro */
.intro { position: fixed; inset: 0; z-index: 9; display: grid; place-items: end center; padding-bottom: calc(60px + env(safe-area-inset-bottom)); pointer-events: none; transition: opacity 0.8s var(--ease); }
.intro.gone { opacity: 0; }
.intro .msg { padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; } }
</style>
</head>
<body>
<canvas id="world"></canvas>

<div class="top">
  <div class="badge glass">
    <span class="live" aria-hidden="true"></span>
    <div><b>Ride On! World</b><small>Concept demo · Ride <span id="rideId">RO-0412</span></small></div>
  </div>
  <div class="top-right">
    <button class="icon-btn glass" id="musicBtn" aria-label="Play music">
      <svg id="musicIc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><line x1="2" y1="2" x2="22" y2="22" id="muteLine"/></svg>
    </button>
    <button class="icon-btn glass" id="replayBtn" aria-label="Replay the unfold">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
  </div>
</div>

<div class="shade"></div>
<div class="hero hide" id="hero">
  <div class="eyebrow">You just scanned</div>
  <h1>The Red Racer.</h1>
  <p>Race it round the track, change the season, or find your next ride.</p>
</div>


<nav class="dock hide" id="dock">
  <button class="cta" id="raceBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>Race the Red Racer</button>
  <div class="tabs glass">
    <button class="tile" data-panel="season"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Seasons</button>
    <button class="tile" data-panel="find"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>Rides</button>
    <button class="tile" data-panel="fault"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>Report</button>
    <button class="tile" data-panel="centres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V4h8v3M3 13h18"/></svg>Centres</button>
  </div>
</nav>

<div class="scrim" id="scrim"></div>
<section class="sheet glass" id="sheet" aria-live="polite"></section>

<div class="hud" id="hud">
  <div class="bar glass"><div id="hudLap">Lap 1/3</div><div id="hudTime">0:00.0</div><div id="hudPos">1st</div></div>
  <button class="icon-btn glass quit" id="quitBtn" aria-label="Leave race"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="count" id="count"></div>
  <button class="tap" id="tapBtn">TAP!</button>
  <div class="result glass" id="result"></div>
</div>

<div class="intro" id="intro"><div class="msg glass" id="introMsg">Unfolding your ride world…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
// Each sticker opens dominicmayne.com/R/<ride id>, so the page knows which ride was scanned
const RIDE_ID = ((location.pathname.match(/\/r\/([A-Za-z0-9-]{2,16})/i) || [])[1] || 'RO-0412').toUpperCase();
const RIDE_URL = 'https://dominicmayne.com/R/' + RIDE_ID;
$('rideId').textContent = RIDE_ID;

/* ---------- Renderer, scene, camera ---------- */
const canvas = $('world');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.NoToneMapping;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);

function skyTexture(top, bottom) {
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, top); gr.addColorStop(1, bottom); g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}

const hemi = new THREE.HemisphereLight(0xdfe8ff, 0x3a2a40, 0.75); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dd, 1.25);
sun.position.set(6, 12, 7); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 40 });
sun.shadow.bias = -0.0004; scene.add(sun);
const warm = new THREE.PointLight(0xff9d5c, 0.9, 18); warm.position.set(-5, 4, -3); scene.add(warm);
const cool = new THREE.PointLight(0x7aa8ff, 0.7, 18); cool.position.set(6, 3.5, -2); scene.add(cool);

// Colours are written in sRGB hex; convert so reds stay red rather than washing out to pink.
const mat = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: new THREE.Color(color).convertSRGBToLinear(), roughness: 0.55, metalness: 0.05 }, o));
const world = new THREE.Group(); scene.add(world);

/* ---------- Mall floor ---------- */
function tileTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
  g.fillStyle = '#9c968f'; g.fillRect(0, 0, 512, 512);
  for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
    const v = 168 + ((x + y) % 2) * 14 + Math.random() * 6;
    g.fillStyle = `rgb(${v},${v - 4},${v - 10})`; g.fillRect(x * 128 + 2, y * 128 + 2, 124, 124);
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(10, 10);
  t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t;
}
const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 64), mat(0xffffff, { map: tileTexture(), roughness: 0.25, metalness: 0.1 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; world.add(floor);

/* ---------- Track (oval) ---------- */
const TRACK = { rx: 6.2, rz: 3.9 };
function ovalRing(rx, rz, w, y, color, rough = 0.8) {
  const shape = new THREE.Shape(); const hole = new THREE.Path(); const N = 96;
  for (let i = 0; i <= N; i++) { const a = (i / N) * Math.PI * 2; const p = [Math.cos(a) * (rx + w / 2), Math.sin(a) * (rz + w / 2)]; i ? shape.lineTo(...p) : shape.moveTo(...p); }
  for (let i = 0; i <= N; i++) { const a = (i / N) * Math.PI * 2; const p = [Math.cos(a) * (rx - w / 2), Math.sin(a) * (rz - w / 2)]; i ? hole.lineTo(...p) : hole.moveTo(...p); }
  shape.holes.push(hole);
  const m = new THREE.Mesh(new THREE.ShapeGeometry(shape, 1), mat(color, { roughness: rough }));
  m.rotation.x = -Math.PI / 2; m.position.y = y; m.receiveShadow = true; return m;
}
const track = new THREE.Group(); world.add(track);
track.add(ovalRing(TRACK.rx, TRACK.rz, 2.4, 0.01, 0x2c2f3a, 0.9));
track.add(ovalRing(TRACK.rx, TRACK.rz, 0.08, 0.02, 0xffffff, 0.4));
// kerbs
for (const off of [-1.25, 1.25]) {
  // one instanced mesh per side instead of 144 separate meshes
  const N = 72, d = new THREE.Object3D();
  const kerbs = new THREE.InstancedMesh(new THREE.BoxGeometry(0.42, 0.08, 0.14), mat(0xffffff), N);
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2;
    d.position.set(Math.cos(a) * (TRACK.rx + off), 0.04, Math.sin(a) * (TRACK.rz + off));
    d.rotation.y = -Math.atan2(Math.cos(a) * TRACK.rz, -Math.sin(a) * TRACK.rx);
    d.updateMatrix(); kerbs.setMatrixAt(i, d.matrix);
    kerbs.setColorAt(i, new THREE.Color(i % 2 ? 0xff3b30 : 0xffffff).convertSRGBToLinear());
  }
  track.add(kerbs);
}
// chequered start line
{
  const c = document.createElement('canvas'); c.width = 64; c.height = 256; const g = c.getContext('2d');

let introT = 0; const INTRO = 4.2; let introDone = false;
const ease = (x) => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
const springE = (x) => { x = Math.min(Math.max(x, 0), 1); return 1 - Math.exp(-6 * x) * Math.cos(9 * x); };
function updateIntro(dt) {
  introT += dt;

  const lift = ease((t - 1.3) / 1.3);

  dark.forEach(([r, c], i) => {
    const s = seeds[i];
    const x = (c - QN / 2 + 0.5) * cell, z = (r - QN / 2 + 0.5) * cell;
    const l = ease((t - 1.3 - s.d) / 1.1);

    dummy.rotation.set(l * s.spin, l * s.spin * 0.6, 0);

    const best = parseFloat(store.get('rw-best') || '0');
    let bestTxt = '';
    if (won) { if (!best || race.time < best) { store.set('rw-best', race.time.toFixed(1)); bestTxt = 'New best time!'; } else bestTxt = `Best ${fmt(best)}`; }
    $('tapBtn').style.display = 'none';
    $('result').innerHTML = `<div class="em">${won ? '🏆' : '🏁'}</div><h3>${won ? 'You won!' : 'So close!'}</h3><p>${won ? fmt(race.time) + ' · ' + bestTxt : 'Blue Flash took it. Tap faster next time.'}</p><button class="pill-btn" id="again">Race again</button><button class="pill-btn blue" id="leave" style="margin-top:8px">Back to the ride</button>`;
    $('result').classList.add('show');
    $('again').onclick = startRace; $('leave').onclick = () => endRace(false);
    if (won) { sfx(660, 0.12); setTimeout(() => sfx(880, 0.12), 130); setTimeout(() => sfx(1320, 0.25), 260); }
  }
}

/* ---------- Sheets ---------- */
const sheet = $('sheet'), scrim = $('scrim');
const check = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const panels = {
  season() {
    const S = [['halloween', '🎃', 'Halloween', 'Pumpkin patch'], ['christmas', '🎄', 'Christmas', 'Trees and snow'], ['easter', '🥚', 'Easter', 'Egg hunt'], ['summer', '☀️', 'Summer', 'Beach day']];
    return `<h2>Seasons</h2><p class="sub">The same sticker opens a new world through the year. Nothing to reprint.</p>
      <div class="seasons">${S.map(([k, em, t, d]) => `<button class="season ${k === season ? 'on' : ''}" data-season="${k}"><div class="em">${em}</div><b>${t}</b><small>${d}</small></button>`).join('')}</div>`;
  },
  find() {
    const pins = [[78, 70, '#ff3b30', 'You'], [210, 52, '#ffcc00', ''], [262, 128, '#30d158', ''], [128, 142, '#0a84ff', '']];
    return `<h2>Find more rides</h2><p class="sub">Other rides in this centre, and the nearest centres with rides.</p>
      <svg class="map" viewBox="0 0 340 190" aria-label="Centre map">
        <rect x="16" y="16" width="308" height="158" rx="22" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-width="2"/>
        <path d="M30 100 H310 M170 30 V160" stroke="currentColor" stroke-opacity=".12" stroke-width="18" stroke-linecap="round"/>
        ${pins.map(([x, y, c, l]) => `<circle cx="${x}" cy="${y}" r="9" fill="${c}"/><circle cx="${x}" cy="${y}" r="15" fill="${c}" opacity=".25"/>${l ? `<text x="${x}" y="${y - 20}" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">${l}</text>` : ''}`).join('')}
      </svg>
      <div class="row"><div class="sw" style="background:#ffcc00">🎠</div><div><b>Carousel</b><small>Level 1, by the fountain</small></div><div class="end">2 min</div></div>
      <div class="row"><div class="sw" style="background:#30d158">🚂</div><div><b>Choo-choo train</b><small>Level 2, food court</small></div><div class="end">4 min</div></div>
      <div class="row"><div class="sw" style="background:#0a84ff">🚁</div><div><b>Helicopter ride</b><small>Level 0, by the lifts</small></div><div class="end">3 min</div></div>
      <div class="row"><div class="sw" style="background:var(--glass-2)">📍</div><div><b>Nearby centre</b><small>6 rides · 4 miles</small></div><div class="end">Open</div></div>
      <p class="note">Ride names and locations are placeholders for the demo.</p>`;
  },
  fault() {
    return `<div id="faultBody"><h2>Ride not working?</h2><p class="sub">Tell us what's wrong. This sticker already knows which ride it's on, so our engineers know exactly where to go.</p>
      <div class="row"><div class="sw" style="background:#ff3b30">🏎️</div><div><b>Red Racer · ${RIDE_ID}</b><small>Level 1, outside Toy Town</small></div></div>
      <div class="chips" style="margin-top:12px">${['Won’t start', 'Payment not working', 'No music or lights', 'Something’s broken', 'Other'].map((t) => `<button class="chip">${t}</button>`).join('')}</div>
      <button class="pill-btn" id="sendFault" disabled>Send to engineers</button>
      <p class="note">We don't ask for any names, phone numbers or details about children.</p></div>`;
  },
  centres() {
    return `<h2>For centre managers</h2><p class="sub">Every sticker shows how families use the rides, ride by ride.</p>
      <div class="stats"><div class="stat"><b>1,284</b><small>Scans this week</small></div><div class="stat"><b>912</b><small>Races played</small></div><div class="stat"><b>4h</b><small>Avg fix time</small></div></div>
      <p class="note" style="margin-top:6px">Example numbers for the demo.</p>
      <a class="pill-btn blue" href="https://rideonentertainment.com/" target="_blank" rel="noopener">Want rides in your centre?</a>`;
  },
};
let openKey = null;
function openSheet(key) {
  if (openKey === key) return closeSheet();
  openKey = key; sheet.innerHTML = '<div class="grab"></div><button class="icon-btn sheet-x" id="sheetX" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg></button>' + panels[key]();
  $('sheetX').onclick = closeSheet;
  sheet.classList.add('show'); scrim.classList.add('show');
  document.querySelectorAll('.tile').forEach((t) => t.classList.toggle('on', t.dataset.panel === key));
  wireSheet(key); sfx(660, 0.05, 'sine', 0.05);
}
function closeSheet() {
  openKey = null; sheet.classList.remove('show'); scrim.classList.remove('show');
  document.querySelectorAll('.tile').forEach((t) => t.classList.remove('on'));
}
function wireSheet(key) {
  if (key === 'season') sheet.querySelectorAll('.season').forEach((b) => (b.onclick = () => {
    setSeason(b.dataset.season); sheet.querySelectorAll('.season').forEach((x) => x.classList.toggle('on', x === b)); sfx(880, 0.08);
  }));
  if (key === 'fault') {
    let pick = null;
    sheet.querySelectorAll('.chip').forEach((c) => (c.onclick = () => { pick = c.textContent; sheet.querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x === c)); $('sendFault').disabled = false; }));
    $('sendFault').onclick = () => {
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      $('faultBody').innerHTML = `<div class="done"><div class="tick">${check}</div><h2>Sent. Thank you!</h2><p class="sub">An engineer has been told about <b>${pick.toLowerCase()}</b> on ride ${RIDE_ID} at ${time}. In the real version this goes straight to Ride On!'s maintenance team.</p></div>`;
      sfx(784, 0.1); setTimeout(() => sfx(1047, 0.2), 110);
    };
  }
}
document.querySelectorAll('.tile').forEach((t) => t.addEventListener('click', () => openSheet(t.dataset.panel)));
scrim.addEventListener('click', closeSheet);
$('replayBtn').addEventListener('click', replayIntro);
$('raceBtn').addEventListener('click', startRace);

/* ---------- Music + sfx (Web Audio, generated) ---------- */
let ac = null, master = null, musicOn = false, nextBar = 0, barIdx = 0, musicTimer = null;
function audio() {
  if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination); }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function note(freq, t, dur, type = 'triangle', vol = 0.08) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function sfx(f, d, type = 'sine', v = 0.08) { if (!ac) return; note(f, ac.currentTime, d, type, v); }
// Bouncy fairground-pop loop, 4 bars at 112 bpm
const BPM = 112, BEAT = 60 / BPM;
const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
const CHORDS = [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]];
const MEL = [[72, 74, 76, 79, 76, 74, 72, -1], [72, 69, 72, 76, 74, 72, 69, -1], [69, 72, 77, 76, 74, 72, 74, -1], [71, 74, 79, 77, 76, 74, 71, 74]];
function scheduleBar(t, i) {
  const ch = CHORDS[i % 4];
  note(hz(ch[0] - 24), t, BEAT * 0.9, 'sine', 0.14); note(hz(ch[0] - 12), t + BEAT * 2, BEAT * 0.9, 'sine', 0.1);
  for (let b = 0; b < 4; b++) { if (b % 2) ch.forEach((m) => note(hz(m), t + b * BEAT, BEAT * 0.5, 'triangle', 0.025)); }
  MEL[i % 4].forEach((m, k) => { if (m > 0) note(hz(m), t + k * BEAT / 2, BEAT * 0.45, 'square', 0.022); });
  for (let k = 0; k < 8; k++) { // soft shaker
    const len = 0.04, buf = ac.createBuffer(1, ac.sampleRate * len, ac.sampleRate), d = buf.getChannelData(0);
    for (let j = 0; j < d.length; j++) d[j] = (Math.random() * 2 - 1) * (1 - j / d.length);
    const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = 6000; g.gain.value = k % 2 ? 0.03 : 0.015;
    s.buffer = buf; s.connect(f); f.connect(g); g.connect(master); s.start(t + k * BEAT / 2);
  }
}
function musicLoop() { while (nextBar < ac.currentTime + 0.6) { scheduleBar(nextBar, barIdx++); nextBar += BEAT * 4; } }
function toggleMusic() {
  audio(); musicOn = !musicOn;
  $('muteLine').style.display = musicOn ? 'none' : '';
  $('musicBtn').setAttribute('aria-label', musicOn ? 'Pause music' : 'Play music');
  if (musicOn) { nextBar = ac.currentTime + 0.05; barIdx = 0; musicTimer = setInterval(musicLoop, 150); musicLoop(); }
  else clearInterval(musicTimer);
}
$('musicBtn').addEventListener('click', toggleMusic);
// Start music on the first touch anywhere (browsers block autoplay)
addEventListener('pointerdown', function first(e) { removeEventListener('pointerdown', first); if (!musicOn && !e.target.closest('#musicBtn')) toggleMusic(); }, { once: true });

/* ---------- Loop ---------- */
const clock = new THREE.Clock();
// Show any error on screen so a phone-only failure can be screenshotted
let errShown = false;
function showError(msg) {
  if (errShown) return; errShown = true;
  const el = document.createElement('div');
  el.className = 'err glass'; el.textContent = 'Something went wrong: ' + msg;
  document.body.appendChild(el);
}
addEventListener('error', (e) => showError(e.message || 'unknown error'));
addEventListener('unhandledrejection', (e) => showError(String(e.reason)));
// Never leave someone stuck on the code: open the world after 7 seconds whatever happens
setTimeout(() => { if (!introDone) { world.visible = true; finishIntro(); } }, 7000);
function tick() {
  requestAnimationFrame(tick);
  try { frame(); } catch (e) { showError(e.message); }
}
function frame() {
  const raw = clock.getDelta(), dt = Math.min(raw, 0.05), t = clock.elapsedTime;
  if (!introDone) updateIntro(Math.min(raw, 0.25));
  if (mode === 'race') updateRace(dt);
  // hero rocks like a kiddie ride
  hero.rotation.z = Math.sin(t * 2.2) * 0.05; hero.rotation.x = Math.sin(t * 1.4) * 0.03; hero.position.y = 0.34 + Math.abs(Math.sin(t * 2.2)) * 0.05;
  hero.rotation.y = -0.5 + Math.sin(t * 0.3) * 0.15;
  ringLight.material.emissiveIntensity = 1.6 + Math.sin(t * 4) * 0.6;
  const snow = seasons.christmas.userData.snow;
  if (seasons.christmas.visible) { const p = snow.geometry.attributes.position; for (let i = 0; i < p.count; i++) { let y = p.getY(i) - dt * 0.8; if (y < 0) y = 10; p.setY(i, y); p.setX(i, p.getX(i) + Math.sin(t + i) * 0.002); } p.needsUpdate = true; }
  (seasons.summer.userData.balls || []).forEach((b, i) => { b.position.y = 0.3 + Math.abs(Math.sin(t * 2 + i)) * 0.5; b.rotation.x += dt * 2; });
  // camera
  if (mode !== 'race' && introDone && performance.now() - lastInteract > 3500 && !drag) orbit.tYaw += dt * 0.06;
  const introCam = !introDone && introT < 2.3;
  const k = 1 - Math.exp(-dt * 3.2);
  orbit.yaw += (orbit.tYaw - orbit.yaw) * k; orbit.pitch += (orbit.tPitch - orbit.pitch) * k; orbit.dist += (orbit.tDist - orbit.dist) * k;
  let pitch = orbit.pitch, dist = orbit.dist;
  if (!introDone) { const a = ease(introT / 2.6); pitch = 1.45 - a * (1.45 - orbit.pitch); dist = (innerHeight > innerWidth ? 25 : 16) + a * (orbit.dist - (innerHeight > innerWidth ? 25 : 16)); }
  camera.position.set(Math.sin(orbit.yaw) * Math.cos(pitch) * dist, Math.sin(pitch) * dist + 0.6, Math.cos(orbit.yaw) * Math.cos(pitch) * dist);
  camera.lookAt(orbit.target);
  renderer.render(scene, camera);
}
tick();
})();
</script>
</body>
